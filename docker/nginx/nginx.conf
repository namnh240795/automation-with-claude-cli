# Nginx API Gateway Configuration
# Rate limiting, reverse proxy, and request routing for all services
# Only port 80 is exposed to external traffic

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ============================================================
    # RATE LIMITING ZONES
    # ============================================================

    # Limit request rate by IP - General API
    # 100 requests per second burst=50
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;

    # Limit request rate by IP - Auth endpoints (stricter for security)
    # 20 requests per second burst=10 - protects against brute force
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/s;

    # Limit request rate by IP - Token endpoint (strictest)
    # 10 requests per second burst=5 - critical for credential brute force protection
    limit_req_zone $binary_remote_addr zone=api_token:10m rate=10r/s;

    # Limit concurrent connections by IP
    # 50 connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Limit connections per server
    # 500 connections per upstream
    limit_conn_zone $server_name zone=conn_limit_per_server:10m;

    # ============================================================
    # UPSTREAM BACKENDS (internal only - not accessible externally)
    # ============================================================

    upstream auth_backend {
        least_conn;
        server auth:3001 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ============================================================
    # PROXY SETTINGS (applied to all upstream routes)
    # ============================================================

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_pass_request_body on;
    proxy_pass_request_headers on;

    # Timeout settings
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    # ============================================================
    # CACHE CONFIGURATION
    # ============================================================

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:100m
                     max_size=1g inactive=60m use_temp_path=off;

    # ============================================================
    # SERVER BLOCK - Only entry point for external traffic
    # ============================================================

    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint - no rate limiting, no proxy
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # AUTH SERVICE ROUTING
        # All /auth/* requests route to auth backend with rate limiting
        # ============================================================

        location /auth/ {
            # Connection limiting
            limit_conn conn_limit_per_ip 50;
            limit_conn conn_limit_per_server 500;

            # Nested location for token endpoint with strictest limits
            location ~ ^/auth/oauth/token$ {
                limit_req zone=api_token burst=5 nodelay;
                proxy_pass http://auth_backend;
            }

            # OAuth endpoints - auth rate limiting
            location ~ ^/auth/oauth/(authorize|revoke|introspect)$ {
                limit_req zone=api_auth burst=10 nodelay;
                proxy_pass http://auth_backend;
            }

            # Device flow endpoints
            location ~ ^/auth/oauth/device/(authorize|verify|consent)$ {
                limit_req zone=api_auth burst=10 nodelay;
                proxy_pass http://auth_backend;
            }

            # User client management endpoints (protected)
            location ~ ^/auth/oauth/user/(clients|tokens) {
                limit_req zone=api_auth burst=20 nodelay;
                proxy_pass http://auth_backend;
            }

            # Client registration/management (less strict)
            location ~ ^/auth/oauth/(register|clients|admin) {
                limit_req zone=api_general burst=30 nodelay;
                proxy_pass http://auth_backend;
            }

            # Default auth route with standard rate limiting
            limit_req zone=api_auth burst=20 nodelay;
            proxy_pass http://auth_backend;
        }

        # ============================================================
        # BLOCK INTERNAL ENDPOINTS FROM EXTERNAL ACCESS
        # These paths should never be accessed externally
        # ============================================================

        # Block direct access to internal ports/protocols
        location ~ ^/(postgres|redis|kafka|rabbitmq|opensearch|metadata|debug) {
            return 404;
            access_log off;
        }

        # Block access to internal dashboards UIs
        location ~ ^/(rabbitmq|kafka|opensearch|elastic|kibana) {
            return 404;
            access_log off;
        }

        # Block suspicious paths
        location ~ /\.(git|env|terraform|aws|ansible) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/(proc|sys|run) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Block common exploit patterns
        location ~ (xmlrpc|adminer|phpmyadmin) {
            return 404;
            access_log off;
        }

        # ============================================================
        # DEFAULT - Route unknown requests to auth (single service mode)
        # In multi-service setup, this would return 404 or route by prefix
        # ============================================================

        location / {
            limit_req zone=api_general burst=50 nodelay;
            limit_conn conn_limit_per_ip 50;
            proxy_pass http://auth_backend;
        }

        # ============================================================
        # ERROR PAGES
        # ============================================================

        error_page 429 503 /errors/rate-limit.html;
        location = /errors/rate-limit.html {
            internal;
            add_header Content-Type text/html;
            return 429 '<html><head><title>Rate Limit Exceeded</title></head><body><h1>429 - Rate Limit Exceeded</h1><p>Please slow down and try again later.</p></body></html>';
        }
    }
}