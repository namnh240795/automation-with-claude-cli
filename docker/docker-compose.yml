# Docker Compose configuration for services
# Each API service should follow the same structure pattern:
# - NestJS + Fastify
# - Modular architecture with controllers, services, DTOs
# - Centralized configuration via ConfigModule
# - Swagger documentation with Scalar reference
# - Health check endpoints
# - API versioning

services:
  # Nginx API Gateway - Rate limiting and reverse proxy
  # All external traffic routes through nginx to internal services
  nginx-gateway:
    image: nginx:alpine
    container_name: claude-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cache:/var/cache/nginx
      - ./nginx/logs:/var/log/nginx
    depends_on:
      auth:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Auth Service - OAuth 2.0 / OIDC provider
  # Port 3001, accessed only through nginx-gateway
  auth:
    build:
      context: ..
      dockerfile: apps/auth/Dockerfile
    container_name: claude-auth
    restart: unless-stopped
    environment:
      SERVICE_PREFIX: auth
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres_root_password_change_this@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # PostgreSQL Database - Internal only, NOT exposed to host
  # Accessible only by auth service container
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_root_password_change_this}
      POSTGRES_DB: postgres
    # Temporarily exposed for migration - will be removed after
    ports:
      - "5432:5432"
    volumes:
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # Redis Cache - Internal only, NOT exposed to host
  # Accessible only by auth service container
  redis:
    image: redis:7-alpine
    container_name: claude-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # NO ports exposed to host - internal only
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # RabbitMQ Message Queue - Internal only, NOT exposed to host
  rabbitmq:
    image: rabbitmq:3-management
    container_name: claude-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_password_change_this}
    # NO ports exposed to host - internal only (management UI removed)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default

  # Kafka Message Queue - Internal only, NOT exposed to host
  kafka:
    image: apache/kafka:3.7.0
    container_name: claude-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    # NO ports exposed to host - internal only
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - default

  # OpenSearch - Accessible for log querying
  # Connect via: http://localhost:9200
  opensearch:
    image: opensearchproject/opensearch:2.6.0
    container_name: claude-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - default

  # OpenSearch Dashboards - Visualize OpenSearch data
  # UI: http://localhost:5601
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.6.0
    container_name: claude-opensearch-dashboards
    restart: unless-stopped
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  opensearch-data:

networks:
  default:
    name: claude-network
    driver: bridge