# Docker Compose configuration for services
# Each API service should follow the same structure pattern:
# - NestJS + Fastify
# - Modular architecture with controllers, services, DTOs
# - Centralized configuration via ConfigModule
# - Swagger documentation with Scalar reference
# - Health check endpoints
# - API versioning

services:
  # PostgreSQL Database Service
  # Each service (api, auth) has its own database and admin credentials
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claude-postgres
    restart: unless-stopped
    environment:
      # Root postgres user for database initialization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_root_password_change_this
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # Mount initialization script to create databases and users
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # Redis Cache Service
  # Used for: caching, rate limiting, session store
  # Connect via: redis://redis:6379 (internal) or redis://localhost:6379 (host)
  redis:
    image: redis:7-alpine
    container_name: claude-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # RabbitMQ Message Queue Service
  # Used for: async messaging, event-driven architecture, background jobs
  # Connect via: amqp://rabbitmq:5672 (internal) or amqp://localhost:5672 (host)
  # Management UI: http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: claude-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq_password_change_this
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default

# Kafka Message Queue Service (KRaft mode, no ZooKeeper)
  # Used for: workflow logging, event-driven messaging
  # Connect via: kafka:9092 (internal) or localhost:9092 (host)
  kafka:
    image: apache/kafka:3.7.0
    container_name: claude-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"     # PLAINTEXT broker
      - "9094:9094"     # EXTERNAL broker
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - default

  # OpenSearch Search & Analytics Service
  # Used for: log storage, search, and analytics
  # Connect via: http://opensearch:9200 (internal) or http://localhost:9200 (host)
  opensearch:
    image: opensearchproject/opensearch:2.6.0
    container_name: claude-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - default

  # OpenSearch Dashboards - Visualize OpenSearch data
  # UI: http://localhost:5601
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.6.0
    container_name: claude-opensearch-dashboards
    restart: unless-stopped
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  opensearch-data:

networks:
  default:
    name: claude-network
    driver: bridge
